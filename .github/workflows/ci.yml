name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Python static correctness checks
        run: |
          python -m pip install 'ruff==0.7.4'
          ruff check --select E4,E7,E9,F src tests
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Test this repository's composite action
        uses: ./
        with:
          fixture: examples/cases.json
      - name: Verify failed assertions keep a usable JUnit report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path("examples/cases.json").read_text())
          fixture["cases"][0]["expected_contains"] = ["intentionally missing text"]
          Path("regression.json").write_text(json.dumps(fixture))
          PY
          status=0
          agent-audit regression.json --format junit > pilot-junit.xml || status=$?
          test "$status" -eq 1
          python - <<'PY'
          from xml.etree import ElementTree

          report = ElementTree.parse("pilot-junit.xml")
          assert report.find(".//testcase/failure") is not None
          PY
      - name: Upload the pilot JUnit report
        if: ${{ !cancelled() && hashFiles('pilot-junit.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-junit-${{ matrix.python-version }}
          path: pilot-junit.xml
          retention-days: 7
          if-no-files-found: error
